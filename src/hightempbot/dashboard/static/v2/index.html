<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HighTempBot — Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/v2/styles.css">
<style>
  /* boot stage shown until React mounts */
  #boot { display: grid; place-items: center; min-height: 100vh; color: var(--fg3); font-family: var(--font-ui); }
  #boot .b-mark { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg,#14181f 0%,#2a323d 100%); color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom: 14px; font-family: var(--font-display); }
</style>
<!-- React + Babel are vendored under /static/v2/vendor/ to eliminate the
     CDN dependency. Previously these loaded from unpkg.com without SRI
     hashes, which let an on-path attacker inject arbitrary JS into the
     authenticated dashboard origin. Same-origin static files remove that
     attack surface entirely. -->
<script src="/static/v2/vendor/react.production.min.js"></script>
<script src="/static/v2/vendor/react-dom.production.min.js"></script>
<script src="/static/v2/vendor/babel.min.js"></script>
<!-- Bot-rendered JS that sets window.HTB_DATA synchronously. -->
<script src="/api/v2/data.js"></script>
<!-- JSX modules: Babel standalone scans for these at DOMContentLoaded and
     compiles them in document order. They register components on `window`. -->
<script type="text/babel" src="/static/v2/Charts.jsx"></script>
<script type="text/babel" src="/static/v2/Shell.jsx"></script>
<script type="text/babel" src="/static/v2/Overview.jsx"></script>
<script type="text/babel" src="/static/v2/Pages2.jsx"></script>
<script type="text/babel" src="/static/v2/Pages3.jsx"></script>
<script type="text/babel" src="/static/v2/Calendar.jsx"></script>
<script type="text/babel" src="/static/v2/Operator.jsx"></script>
<script type="text/babel" src="/static/v2/Strategy.jsx"></script>
</head>
<body>
<div id="root">
  <div id="boot"><div><div class="b-mark">H</div><div>Loading dashboard…</div></div></div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [tweaks, setTweaks] = useState({ density: "balanced", accent: "#1f6feb" });
  const [page, setPage] = useState("overview");
  const [range, setRange] = useState("All");
  const [data, setData] = useState(window.HTB_DATA);
  const initialBootstrapPending = useRef(Boolean(window.HTB_DATA));
  const d = data;

  // Apply accent live via CSS var
  useEffect(() => {
    document.documentElement.style.setProperty("--accent", tweaks.accent);
    const r = parseInt(tweaks.accent.slice(1,3), 16);
    const g = parseInt(tweaks.accent.slice(3,5), 16);
    const b = parseInt(tweaks.accent.slice(5,7), 16);
    document.documentElement.style.setProperty("--accent-bg", `rgba(${r},${g},${b},0.08)`);
  }, [tweaks.accent]);

  useEffect(() => {
    let cancelled = false;
    const refresh = async () => {
      // Skip polls for 5s after an operator action (window.__htbMutationAt).
      const mutAt = (window.__htbMutationAt | 0);
      if (mutAt && (Date.now() - mutAt) < 5000) return;
      try {
        const qs = new URLSearchParams();
        if (range && range !== "All") qs.set("range", range);
        const resp = await fetch(`/api/v2/data${qs.toString() ? "?" + qs.toString() : ""}`, { cache: "no-store" });
        if (!cancelled && resp.ok) setData(await resp.json());
      } catch (err) {
        // Keep the last good payload on transient refresh failures.
      }
    };
    if (initialBootstrapPending.current && range === "All") {
      initialBootstrapPending.current = false;
    } else {
      refresh();
    }
    const timer = setInterval(refresh, 30000);
    return () => {
      cancelled = true;
      clearInterval(timer);
    };
  }, [range]);

  if (!d) {
    return (
      <div id="boot" style={{color: "var(--red)"}}>
        <div>
          <div className="b-mark">!</div>
          <div>Dashboard data missing. Check <code>/api/v2/data.js</code>.</div>
        </div>
      </div>
    );
  }

  const pageMeta = {
    overview: { title: "Overview", sub: "Trading performance at a glance" },
    performance: { title: "Performance analytics", sub: "Risk-adjusted returns, by station, by week" },
    trades: { title: "Trade journal", sub: "Open positions and resolved bet history" },
    strategy: { title: "Strategy", sub: "Entry conditions for the enabled strategies" },
    operator: { title: "Operator", sub: "Fund once, trade from the configured wallet, withdraw optionally" },
    calendar: { title: "Calendar", sub: "Per target-date trades, win rate and P&L" },
    calibration: { title: "Forecast calibration", sub: "Predicted probability vs observed hit rate" },
    models: { title: "Forecast models", sub: "Per-model accuracy across stations" },
    stations: { title: "Stations", sub: "Eligibility funnel and per-station status" },
  };
  const meta = pageMeta[page];

  return (
    <div className="app" data-density={tweaks.density}>
      <Sidebar page={page} setPage={setPage} d={d} />
      <div className="main">
        <Topbar
          title={meta.title}
          sub={meta.sub}
          mode={d.mode || "DRY-RUN"}
          range={page === "overview" ? range : null}
          setRange={page === "overview" ? setRange : null}
        />
        <HaltedBanner
          ddPct={d.ddPct}
          halt={d.ddHaltThreshold || 40}
        />
        {page === "overview" && <OverviewPage d={d} range={range} />}
        {page === "calendar" && <CalendarPage d={d} />}
        {page === "performance" && <PerformancePage d={d} />}
        {page === "trades" && <TradesPage d={d} range={range} setRange={setRange} />}
        {page === "strategy" && <StrategyPage d={d} />}
        {page === "operator" && <OperatorPage d={d} setData={setData} />}
        {page === "calibration" && <CalibrationPage d={d} />}
        {page === "models" && <ModelsPage d={d} />}
        {page === "stations" && <StationsPage d={d} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
